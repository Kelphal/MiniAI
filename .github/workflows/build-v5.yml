name: MiniAI v5 Windows x64 development build
on:
  workflow_dispatch:
  push:
    branches: [v5.0-dev]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build and package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Runtime/Flux | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/MiniAI.exe .
          Copy-Item Runtime/Flux/flux_worker.py dist/Runtime/Flux/flux_worker.py
          Copy-Item README_v5.md dist/README_v5.md
          Compress-Archive -Path dist/* -DestinationPath MiniAI-v5.0-dev-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MiniAI-v5.0-dev-windows-x64
          path: MiniAI-v5.0-dev-windows-x64.zip
